# tools.lock — the exact third-party binaries this pipeline downloads, and their
# checksums. Sourced by build-appimage.sh and setup-buildbox.sh. Nothing here is
# committed: everything lands under build/ (gitignored) and is verified against
# these pins on every run, so a re-run is a re-download only when one is absent.
#
# Why these exact ones:
#   * appimagetool 1.9.1 is a *tagged* release (2025-11-18), not `continuous`:
#     the continuous tag moves, a tag does not. Its AppImage is unsigned, so the
#     sha256 below is the only integrity anchor — verify it before trusting a copy.
#   * type2-runtime is pinned to the 20251108 release asset instead of letting
#     appimagetool download "the latest runtime" at build time (its default).
#     That download is the one non-reproducible step in a naive AppImage build.
#     The runtime *is* GPG-signed; verify it with the .sig + pubkey below.
#   * ubuntu-base 22.04.5 (jammy) rootfs is the build box for the glibc floor.

APPIMAGETOOL_VERSION=1.9.1
APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
APPIMAGETOOL_SHA256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

# 1.9.1 asset reports: "appimagetool, continuous build (git version 8c8c91f),
# build 296 built on 2025-12-04 17:55:56 UTC". `--appimage-signature` prints
# nothing => no embedded GPG signature on this asset.

RUNTIME_RELEASE=20251108
RUNTIME_URL="https://github.com/AppImage/type2-runtime/releases/download/${RUNTIME_RELEASE}/runtime-x86_64"
RUNTIME_SHA256=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
RUNTIME_SIG_URL="https://github.com/AppImage/type2-runtime/releases/download/${RUNTIME_RELEASE}/runtime-x86_64.sig"
RUNTIME_PUBKEY_URL="https://github.com/AppImage/type2-runtime/releases/download/${RUNTIME_RELEASE}/signing-pubkey.asc"
# AppImage type 2 runtime <type2-runtime@appimage.org>, EdDSA
RUNTIME_SIGNING_FPR=570C77ACEA40C0F1B758902CBF96CCA56490F695

UBUNTU_BASE_VERSION=22.04.5
UBUNTU_BASE_GLIBC=2.35
UBUNTU_BASE_URL="https://cdimage.ubuntu.com/ubuntu-base/releases/${UBUNTU_BASE_VERSION}/release/ubuntu-base-22.04-base-amd64.tar.gz"
UBUNTU_BASE_SHA256SUMS_URL="https://cdimage.ubuntu.com/ubuntu-base/releases/${UBUNTU_BASE_VERSION}/release/SHA256SUMS"
UBUNTU_BASE_SHA256=df6fe77cee11bd216ac532f0ee082bdc4da3c0cc1f1d9cb20f3f743196bc4b07

# Vendored SDL2 built inside the box. Not downloaded: it is the copy the tree
# already carries for Android (EFAndroid-SP/app/jni/SDL, 2.30.9), so the Linux
# build links the same SDL the APK ships instead of the host distro's.
SDL2_VERSION=2.30.9

# FFmpeg, built from source *inside* the box. The engine's Bink path uses the
# FFmpeg >= 5.1 API (AVCodecContext.ch_layout) and jammy ships 4.4, so the box
# builds the same pin the host has (6.1.1) and the AppImage bundles it. The
# configuration is deliberately minimal — Bink demuxer + its two audio decoders +
# binkvideo + swscale, everything else off — which is exactly what the Android
# build's static FFmpeg libs carry, and it keeps libavformat's gnutls/zmq/srt/ssh
# dependency closure out of the image.
FFMPEG_VERSION=6.1.1
FFMPEG_URL="https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
# sha256 of the official HTTPS download; ffmpeg.org also publishes a detached
# GPG signature (ffmpeg-6.1.1.tar.xz.asc) next to it.
FFMPEG_SHA256=8684f4b00f94b85461884c3719382f1261f0d9eb3d59640a1f4ac0873616f968
# components the engine actually uses (bink_ff.c): verified after configure.
FFMPEG_CODECS="bink,binkaudio_rdft,binkaudio_dct"
